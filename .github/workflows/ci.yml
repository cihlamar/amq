---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Run cspell
        uses: streetsidesoftware/cspell-action@v9
        with:
          incremental_files_only: false
          use_cspell_files: true

  ci:
    uses: ansible-middleware/github-actions/.github/workflows/ci.yml@rootperm
    secrets: inherit
    with:
      fqcn: 'middleware_automation/amq'
      root_permission_varname: 'activemq_install_requires_become'
      molecule_tests: >-
        [ "default", "amq_upgrade", "static_cluster", "replication", "schema_validation", "security_matches", "live_only", "mirroring", "custom_xml", "federation", "mask_passwords", "uninstall", "console_access" ]
